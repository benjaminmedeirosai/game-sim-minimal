name: Deploy web client to GitHub Pages

# Builds the browser client (apps/web) and publishes the static bundle to
# GitHub Pages. The Node host is NOT deployed — visitors load the client and
# connect to a live host over the public PeerJS broker; with no host up they
# see the in-app connection landing page.
#
# One-time setup in the repo UI: Settings -> Pages -> Build and deployment ->
# Source -> "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scopes the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
